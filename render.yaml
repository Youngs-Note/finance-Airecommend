services:
  - type: web
    name: finance-airecommend-api
    runtime: python
    branch: develop
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    buildCommand: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: APP_ENV
        value: production
      - key: APP_DATA_MODE
        value: finlife
      - key: FINLIFE_API_KEY
        sync: false
      - key: FINLIFE_BASE_URL
        value: https://finlife.fss.or.kr/finlifeapi
      - key: FINLIFE_BANK_GROUP_CODE
        value: "020000"
      - key: FINLIFE_TIMEOUT_SECONDS
        value: "10"
      - key: FINLIFE_CACHE_TTL_SECONDS
        value: "21600"
      - key: OPENAI_EXPLANATIONS_ENABLED
        value: "false"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.4-mini
      - key: OPENAI_TIMEOUT_SECONDS
        value: "15"
      - key: MYSQL_ENABLED
        value: "true"
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        sync: false
      - key: MYSQL_DATABASE
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
